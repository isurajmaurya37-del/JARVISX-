name: Build JARVIS
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/jarvis/assistant
          cat > settings.gradle << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'JARVIS'
          include ':app'
          EOF
          cat > build.gradle << 'EOF'
          plugins { id 'com.android.application' version '8.3.2' apply false }
          EOF
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.jarvis.assistant'
            compileSdk 34
            defaultConfig { applicationId 'com.jarvis.assistant'; minSdk 26; targetSdk 34; versionCode 1; versionName '1.0' }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.RECORD_AUDIO"/>
            <uses-permission android:name="android.permission.CALL_PHONE"/>
            <uses-permission android:name="android.permission.SET_ALARM"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
            <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
            <queries><intent><action android:name="android.speech.RecognitionService"/></intent></queries>
            <application android:label="JARVIS" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
              <service android:name=".ListenService" android:exported="false" android:foregroundServiceType="microphone"/>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/jarvis/assistant/MainActivity.java << 'EOF'
          package com.jarvis.assistant;
          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;
          public class MainActivity extends Activity {
            boolean on = false;
            Button tg;
            TextView tv(String t, int sz) {
              TextView v = new TextView(this); v.setText(t); v.setTextColor(Color.parseColor("#e6f3ff"));
              v.setTextSize(sz); v.setGravity(Gravity.CENTER); v.setPadding(0, 16, 0, 16); return v;
            }
            Button bt(String t, View.OnClickListener c) {
              Button b = new Button(this); b.setText(t); b.setOnClickListener(c); return b;
            }
            boolean ok() {
              if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO, Manifest.permission.CALL_PHONE}, 1);
                return false;
              }
              return true;
            }
            void cmd(String t) {
              if (!ok()) return;
              startForegroundService(new Intent(this, ListenService.class).setAction("CMD").putExtra("t", t));
            }
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              LinearLayout l = new LinearLayout(this);
              l.setOrientation(LinearLayout.VERTICAL);
              l.setBackgroundColor(Color.parseColor("#050b1a"));
              l.setPadding(40, 90, 40, 40);
              l.addView(tv("J.A.R.V.I.S.", 30));
              l.addView(tv("Just A Rather Very Intelligent System", 12));
              tg = bt("🎙 JARVIS चालू करो", v -> {
                if (!ok()) return;
                if (!on) {
                  on = true;
                  startForegroundService(new Intent(this, ListenService.class).setAction("LISTEN"));
                  tg.setText("⏹ JARVIS बंद करो");
                } else {
                  on = false;
                  stopService(new Intent(this, ListenService.class));
                  tg.setText("🎙 JARVIS चालू करो");
                }
              });
              l.addView(tg);
              l.addView(bt("👩 लड़की आवाज़", v -> cmd("girl voice")));
              l.addView(bt("🤖 रोबोट आवाज़", v -> cmd("robot voice")));
              l.addView(bt("🎙 JARVIS आवाज़", v -> cmd("jarvis voice")));
              l.addView(bt("ऐप अपने आप खोलने की अनुमति दें", v -> startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName())))));
              EditText e = new EditText(this);
              e.setHint("कमांड लिखें…"); e.setTextColor(Color.WHITE); e.setHintTextColor(Color.GRAY);
              l.addView(e);
              l.addView(bt("भेजो", v -> {
                if (e.getText().length() > 0) { cmd(e.getText().toString()); e.setText(""); }
              }));
              setContentView(l);
              if (Build.VERSION.SDK_INT >= 33)
                requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO, Manifest.permission.CALL_PHONE, Manifest.permission.POST_NOTIFICATIONS}, 1);
              else
                requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO, Manifest.permission.CALL_PHONE}, 1);
            }
          }
          EOF
          cat > app/src/main/java/com/jarvis/assistant/ListenService.java << 'EOF'
          package com.jarvis.assistant;
          import android.app.*;
          import android.content.*;
          import android.content.pm.*;
          import android.hardware.camera2.*;
          import android.media.AudioManager;
          import android.net.Uri;
          import android.os.*;
          import android.provider.*;
          import android.speech.*;
          import android.speech.tts.*;
          import java.util.*;
          import java.util.regex.*;
          public class ListenService extends Service implements TextToSpeech.OnInitListener {
            static final String[] WAKE = {"jarvis", "जार्विस", "जारविस", "जर्विस", "जारवेस", "जार्वेस", "जारवीस", "जार्विज"};
            static final String[][] APPS = {
              {"youtube yt यूट्यूब", "com.google.android.youtube"}, {"whatsapp व्हाट्सएप वाट्सएप", "com.whatsapp"},
              {"instagram इंस्टाग्राम इंस्टा", "com.instagram.android"}, {"facebook फेसबुक", "com.facebook.katana"},
              {"chrome क्रोम", "com.android.chrome"}, {"gmail जीमेल", "com.google.android.gm"},
              {"maps मैप", "com.google.android.apps.maps"}, {"spotify स्पॉटिफाई", "com.spotify.music"},
              {"telegram टेलीग्राम", "org.telegram.messenger"}, {"phonepe फोनपे", "com.phonepe.app"},
              {"paytm पेटीएम", "net.one97.paytm"}, {"amazon अमेज़न", "in.amazon.mShop.android.shopping"},
              {"photos फोटो गैलरी", "com.google.android.apps.photos"}, {"calculator कैलकुलेटर", "com.google.android.calculator"}
            };
            Handler h = new Handler(Looper.getMainLooper());
            SpeechRecognizer sr;
            TextToSpeech tts;
            SharedPreferences sp;
            boolean ready, listening, speaking, awaitCmd;
            String pending;
            public IBinder onBind(Intent i) { return null; }
            public void onCreate() {
              super.onCreate();
              sp = getSharedPreferences("j", 0);
              tts = new TextToSpeech(this, this);
            }
            public void onInit(int st) {
              ready = st == TextToSpeech.SUCCESS;
              if (!ready) return;
              tts.setLanguage(new Locale("hi", "IN"));
              tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                public void onStart(String id) {}
                public void onDone(String id) { h.post(() -> { speaking = false; if (listening) listen(); }); }
                public void onError(String id) { h.post(() -> { speaking = false; if (listening) listen(); }); }
              });
              if (pending != null) { say(pending); pending = null; }
            }
            public int onStartCommand(Intent i, int f, int id) {
              NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
              nm.createNotificationChannel(new NotificationChannel("j", "JARVIS", NotificationManager.IMPORTANCE_LOW));
              startForeground(1, new Notification.Builder(this, "j").setContentTitle("JARVIS तैयार है").setSmallIcon(android.R.drawable.ic_btn_speak_now).build());
              String a = i == null ? "" : String.valueOf(i.getAction());
              if (a.equals("LISTEN")) {
                if (!SpeechRecognizer.isRecognitionAvailable(this)) { say("इस फ़ोन में आवाज़ पहचान नहीं मिली।"); return START_STICKY; }
                listening = true;
                say("सुन रहा हूँ। बोलिए, जारविस।");
              } else if (a.equals("CMD")) {
                handle(i.getStringExtra("t"));
              }
              return START_STICKY;
            }
            public void onDestroy() {
              listening = false;
              if (sr != null) sr.destroy();
              if (tts != null) tts.shutdown();
              super.onDestroy();
            }
            void say(String t) {
              if (!ready) { pending = t; return; }
              speaking = true;
              try { if (sr != null) sr.cancel(); } catch (Exception e) {}
              String v = sp.getString("v", "girl");
              tts.setPitch(v.equals("girl") ? 1.3f : v.equals("robot") ? 0.5f : 0.8f);
              tts.setSpeechRate(v.equals("robot") ? 0.85f : 0.95f);
              try {
                List<Voice> hv = new ArrayList<>();
                for (Voice x : tts.getVoices()) if (x.getLocale().getLanguage().equals("hi")) hv.add(x);
                Collections.sort(hv, (p, q) -> p.getName().compareTo(q.getName()));
                if (!hv.isEmpty()) tts.setVoice(v.equals("girl") ? hv.get(0) : hv.get(hv.size() - 1));
              } catch (Exception e) {}
              tts.speak(t, TextToSpeech.QUEUE_FLUSH, null, "u");
            }
            void again(long ms) { h.postDelayed(() -> listen(), ms); }
            void listen() {
              if (!listening || speaking) return;
              try {
                if (sr != null) sr.destroy();
                sr = SpeechRecognizer.createSpeechRecognizer(this);
                sr.setRecognitionListener(new RecognitionListener() {
                  public void onReadyForSpeech(Bundle b) {}
                  public void onBeginningOfSpeech() {}
                  public void onRmsChanged(float v) {}
                  public void onBufferReceived(byte[] b) {}
                  public void onEndOfSpeech() {}
                  public void onPartialResults(Bundle b) {}
                  public void onEvent(int t, Bundle b) {}
                  public void onError(int e) { if (listening && !speaking) again(e == 8 ? 1500 : 600); }
                  public void onResults(Bundle b) {
                    ArrayList<String> r = b.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                    if (r != null && !r.isEmpty()) heard(r.get(0));
                    if (listening && !speaking) again(300);
                  }
                });
                Intent r = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                r.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                r.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN");
                sr.startListening(r);
              } catch (Exception e) { again(1500); }
            }
            void heard(String raw) {
              String s = raw.toLowerCase();
              if (awaitCmd) { awaitCmd = false; handle(raw); return; }
              String hit = null;
              for (String w : WAKE) if (s.contains(w)) { hit = w; break; }
              if (hit == null) return;
              String c = strip(s.replace(hit, " "), "sir,hey,सर,हे,ok,ओके");
              if (c.isEmpty()) { awaitCmd = true; say("जी सर?"); } else handle(c);
            }
            boolean has(String s, String re) { return Pattern.compile(re).matcher(s).find(); }
            String strip(String s, String words) {
              Set<String> w = new HashSet<>(Arrays.asList(words.split(",")));
              StringBuilder b = new StringBuilder();
              for (String t : s.trim().split("\\s+")) if (!w.contains(t)) b.append(t).append(' ');
              return b.toString().trim();
            }
            void go(Intent i) {
              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
              try { startActivity(i); } catch (Exception e) { say("यह नहीं हो पाया।"); }
            }
            void view(String url, String pkg) {
              Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
              if (pkg != null && getPackageManager().getLaunchIntentForPackage(pkg) != null) i.setPackage(pkg);
              go(i);
            }
            void openPkg(String pkg, String name) {
              Intent li = getPackageManager().getLaunchIntentForPackage(pkg);
              if (li == null) { go(new Intent(Intent.ACTION_VIEW, Uri.parse("market://details?id=" + pkg))); say(name + " इंस्टॉल नहीं है।"); }
              else { go(li); say(name + " खोल दिया।"); }
            }
            void torch(boolean on) {
              try {
                CameraManager cm = (CameraManager) getSystemService(CAMERA_SERVICE);
                for (String id : cm.getCameraIdList()) {
                  CameraCharacteristics c = cm.getCameraCharacteristics(id);
                  Boolean f = c.get(CameraCharacteristics.FLASH_INFO_AVAILABLE);
                  Integer fc = c.get(CameraCharacteristics.LENS_FACING);
                  if (f != null && f && fc != null && fc == CameraCharacteristics.LENS_FACING_BACK) {
                    cm.setTorchMode(id, on);
                    say(on ? "टॉर्च चालू है।" : "टॉर्च बंद कर दी।");
                    return;
                  }
                }
                say("इस फ़ोन में टॉर्च नहीं मिली।");
              } catch (Exception e) { say("टॉर्च नहीं चल पाई।"); }
            }
            void handle(String raw) {
              if (raw == null) return;
              String s = raw.toLowerCase().trim();
              if (s.isEmpty()) return;
              if (has(s, "आवाज|voice|वॉइस")) {
                String v = has(s, "लड़की|girl") ? "girl" : has(s, "robot|रोबोट") ? "robot" : has(s, "jarvis|जार्विस|जारविस") ? "jarvis" : null;
                if (v != null) { sp.edit().putString("v", v).apply(); say("ठीक है, आवाज़ बदल दी।"); return; }
              }
              if (has(s, "बंद हो जाओ|band ho jao|exit|shut down")) {
                listening = false; say("ठीक है सर, बंद हो रहा हूँ।");
                h.postDelayed(() -> stopSelf(), 2500); return;
              }
              if (has(s, "torch|टॉर्च|टोर्च|flashlight|फ्लैशलाइट")) { torch(!has(s, "off|ऑफ|बंद|बुझा")); return; }
              if (has(s, "alarm|अलार्म")) {
                Matcher m = Pattern.compile("(\\d{1,2})\\s*(?:[:.]\\s*(\\d{2}))?").matcher(s);
                if (m.find()) {
                  int hh = Integer.parseInt(m.group(1)), mm = m.group(2) == null ? 0 : Integer.parseInt(m.group(2));
                  if (has(s, "pm|शाम|रात|दोपहर") && hh < 12) hh += 12;
                  if (hh < 24 && mm < 60) {
                    go(new Intent(AlarmClock.ACTION_SET_ALARM).putExtra(AlarmClock.EXTRA_HOUR, hh).putExtra(AlarmClock.EXTRA_MINUTES, mm).putExtra(AlarmClock.EXTRA_MESSAGE, "JARVIS").putExtra(AlarmClock.EXTRA_SKIP_UI, true));
                    say("अलार्म लगा दिया।"); return;
                  }
                }
              }
              Matcher t = Pattern.compile("(\\d+)\\s*(sec|सेकंड|सेकेंड|min|मिनट|hour|घंटे|घंटा)").matcher(s);
              if (t.find() && has(s, "timer|टाइमर|reminder|रिमाइंडर|याद")) {
                int n = Integer.parseInt(t.group(1)); String u = t.group(2);
                int sec = u.startsWith("sec") || u.startsWith("से") ? n : u.startsWith("hour") || u.startsWith("घं") ? n * 3600 : n * 60;
                go(new Intent(AlarmClock.ACTION_SET_TIMER).putExtra(AlarmClock.EXTRA_LENGTH, sec).putExtra(AlarmClock.EXTRA_MESSAGE, "JARVIS").putExtra(AlarmClock.EXTRA_SKIP_UI, true));
                say("टाइमर चालू।"); return;
              }
              if (has(s, "call|कॉल|फोन कर|dial")) {
                String d = s.replaceAll("[^0-9+]", "");
                if (d.length() >= 5) {
                  boolean can = checkSelfPermission(android.Manifest.permission.CALL_PHONE) == PackageManager.PERMISSION_GRANTED;
                  go(new Intent(can ? Intent.ACTION_CALL : Intent.ACTION_DIAL, Uri.parse("tel:" + d)));
                  say("कॉल लगा रहा हूँ।");
                } else { go(new Intent(Intent.ACTION_DIAL)); say("डायलर खोल दिया।"); }
                return;
              }
              if (has(s, "youtube|यूट्यूब|गाना|गाने|song|play|चला|बजा")) {
                String q = strip(s, "youtube,यूट्यूब,पर,गाना,गाने,song,songs,play,चलाओ,चला,दो,बजाओ,बजा,खोलो,खोल,open,के,का,की,on,में,सुनाओ");
                if (!q.isEmpty()) { view("https://www.youtube.com/results?search_query=" + Uri.encode(q), "com.google.android.youtube"); say(q + " चला रहा हूँ।"); return; }
              }
              if (has(s, "navigate|रास्ता|नेविगेट|nearby|आसपास")) {
                String q = strip(s, "navigate,रास्ता,नेविगेट,nearby,आसपास,का,की,के,to,दिखाओ,बताओ");
                if (!q.isEmpty()) { view("https://www.google.com/maps/search/?api=1&query=" + Uri.encode(q), null); say(q + " का रास्ता खोल रहा हूँ।"); return; }
              }
              if (has(s, "search|सर्च|गूगल|google|ढूंढ|खोज")) {
                String q = strip(s, "google,गूगल,पर,search,सर्च,करो,कर,ढूंढो,ढूंढ,खोजो,खोज,for,about");
                if (!q.isEmpty()) { view("https://www.google.com/search?q=" + Uri.encode(q), null); say(q + " खोज रहा हूँ।"); return; }
              }
              if (has(s, "camera|कैमरा")) { go(new Intent(MediaStore.INTENT_ACTION_STILL_IMAGE_CAMERA)); say("कैमरा खोल दिया।"); return; }
              if (has(s, "wifi|wi-fi|वाई")) {
                go(new Intent(Build.VERSION.SDK_INT >= 29 ? Settings.Panel.ACTION_INTERNET_CONNECTIVITY : Settings.ACTION_WIFI_SETTINGS));
                say("Wi-Fi का पैनल खोल दिया।"); return;
              }
              if (has(s, "bluetooth|ब्लूटूथ")) { go(new Intent(Settings.ACTION_BLUETOOTH_SETTINGS)); say("ब्लूटूथ सेटिंग खोल दी।"); return; }
              if (has(s, "setting|सेटिंग")) { go(new Intent(Settings.ACTION_SETTINGS)); say("सेटिंग खोल दी।"); return; }
              if (has(s, "volume|वॉल्यूम")) {
                AudioManager am = (AudioManager) getSystemService(AUDIO_SERVICE);
                int mx = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC);
                am.setStreamVolume(AudioManager.STREAM_MUSIC, has(s, "बढ़ा|up|full|फुल|ज्यादा|ज़्यादा") ? mx : has(s, "कम|down|low|mute") ? mx / 5 : mx / 2, 0);
                say("वॉल्यूम सेट कर दिया।"); return;
              }
              if (has(s, "समय|कितने बजे|what time")) {
                Calendar c = Calendar.getInstance();
                say("अभी " + (c.get(Calendar.HOUR) == 0 ? 12 : c.get(Calendar.HOUR)) + " बजकर " + c.get(Calendar.MINUTE) + " मिनट हुए हैं।"); return;
              }
              Set<String> tk = new HashSet<>(Arrays.asList(s.split("\\s+")));
              for (String[] a : APPS) for (String n : a[0].split(" ")) if (tk.contains(n)) { openPkg(a[1], a[0].split(" ")[0]); return; }
              PackageManager pm = getPackageManager();
              Intent mi = new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER);
              for (ResolveInfo r : pm.queryIntentActivities(mi, 0)) {
                String lb = r.loadLabel(pm).toString().toLowerCase();
                if (lb.length() >= 3 && s.contains(lb)) { openPkg(r.activityInfo.packageName, lb); return; }
              }
              view("https://www.google.com/search?q=" + Uri.encode(s), null);
              say("यह मुझे सीधे नहीं पता, गूगल पर खोज रहा हूँ।");
            }
          }
          EOF
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk JARVIS.apk
          gh release create "v${{ github.run_number }}" JARVIS.apk --title "JARVIS v${{ github.run_number }}" --notes "JARVIS Android app" --repo "${{ github.repository }}"
